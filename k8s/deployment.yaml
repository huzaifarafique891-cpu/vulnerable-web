apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsentinel-vulnerable-demo
  namespace: cloudsentinel-vulnerable-demo
  labels:
    app: cloudsentinel-vulnerable-demo
    app.kubernetes.io/name: cloudsentinel-vulnerable-demo
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cloudsentinel-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudsentinel-vulnerable-demo
  template:
    metadata:
      labels:
        app: cloudsentinel-vulnerable-demo
    spec:
      # Pod-level security context - strictly non-root execution
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vulnerable-demo-app
          image: cloudsentinel-vulnerable-demo:1.0.0
          imagePullPolicy: IfNotPresent
          # Container-level security context - no privilege escalation, drop all capabilities
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: "250m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
